<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143a25"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Șeptică"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icons/septica-mark.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icons/septica-mark.svg">
<meta name="theme-color" content="#143a25">
<title>Șeptică Multiplayer</title>
<style>
:root{
  --felt-1:#17462b;--felt-2:#0d301d;--felt-3:#092216;
  --wood-1:#5d341b;--wood-2:#2c160b;
  --gold:#d7b45c;--gold-soft:#f0d891;
  --cream:#f7f2e5;--muted:#b5c3b9;
  --panel:rgba(7,24,15,.38);--line:rgba(240,216,145,.18);
  --shadow:0 18px 50px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#08160d;color:var(--cream)}
body{padding:clamp(10px,2.2vw,28px);display:flex;justify-content:center;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 0%,rgba(95,147,105,.14),transparent 45%),linear-gradient(145deg,#08160d,#10271a 48%,#08140c);pointer-events:none}
main{position:relative;width:min(1120px,100%);z-index:1}
button,input{font:inherit}
.hidden{display:none!important}
.wood-frame{background:linear-gradient(135deg,var(--wood-1),var(--wood-2));border:1px solid #8b5a2d;padding:clamp(7px,1vw,12px);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.42),inset 0 0 0 2px rgba(255,224,165,.08)}
.table{position:relative;min-height:min(760px,calc(100dvh - 32px));border-radius:20px;overflow:hidden;padding:clamp(14px,2vw,24px);background:radial-gradient(circle at 50% 36%,rgba(67,124,76,.26),transparent 46%),linear-gradient(160deg,var(--felt-1),var(--felt-2) 56%,var(--felt-3));border:1px solid rgba(217,180,92,.16);box-shadow:inset 0 0 90px rgba(0,0,0,.24)}
.table:after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.035);border-radius:20px;pointer-events:none}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px}
.brand{font-weight:850;letter-spacing:.02em;font-size:clamp(16px,2.2vw,22px)}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;color:var(--muted);font-size:12px}
.chip{padding:7px 10px;border:1px solid var(--line);background:rgba(0,0,0,.16);border-radius:999px}
.score{display:flex;justify-content:center;margin:4px 0 8px}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:15px;padding:10px 18px;border-radius:16px;border:1px solid rgba(240,216,145,.2);background:linear-gradient(180deg,rgba(8,24,14,.72),rgba(8,24,14,.48));box-shadow:var(--shadow)}
.score-side{text-align:center}.score-name{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin-bottom:2px}.score-number{font-size:clamp(22px,4vw,34px);font-weight:900;line-height:1}
.score-divider{font-size:12px;color:var(--gold-soft);font-weight:800}
.board{display:grid;grid-template-rows:auto minmax(120px,1fr) auto;gap:20px;min-height:calc(100% - 76px)}
.player-row{display:flex;justify-content:center}
.player-card{width:min(360px,75%);display:flex;align-items:center;justify-content:center;gap:12px;padding:9px 13px;border-radius:14px;border:1px solid var(--line);background:rgba(8,25,15,.4)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#6f5330,#2b180a);border:1px solid rgba(240,216,145,.32);font-weight:900;color:var(--gold-soft)}
.player-info{min-width:0}.player-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.player-value{font-weight:750;font-size:14px}
.turn-dot{margin-left:auto;width:9px;height:9px;border-radius:50%;background:#6c786f;box-shadow:0 0 0 4px rgba(108,120,111,.1)}
.turn-dot.active{background:#e2c06d;box-shadow:0 0 0 4px rgba(226,192,109,.13),0 0 14px rgba(226,192,109,.45)}
.table-center{display:grid;align-content:center;gap:18px}
.opponent-hand{display:flex;justify-content:center;min-height:54px}
.cards{display:flex;justify-content:center;gap:clamp(5px,1vw,9px);flex-wrap:wrap}
.card{position:relative;width:clamp(48px,6vw,64px);aspect-ratio:.70;background:linear-gradient(145deg,#fffdf7,#ece7db);color:#23190f;border-radius:10px;border:1px solid rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:clamp(18px,2.6vw,25px);font-weight:900;box-shadow:0 8px 16px rgba(0,0,0,.22);transition:transform .16s ease,box-shadow .16s ease,opacity .16s ease;cursor:pointer}
.card:hover:not(.disabled){transform:translateY(-6px);box-shadow:0 13px 24px rgba(0,0,0,.28)}
.card.disabled{opacity:.34;cursor:default}
.back{background:repeating-linear-gradient(135deg,#284f36 0 5px,#1e432c 5px 10px);color:#e4cb83;border-color:rgba(240,216,145,.25);cursor:default}
.sequence-wrap{display:flex;justify-content:center}
.sequence{min-height:92px;min-width:min(520px,90%);padding:12px 18px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:18px;border:1px solid rgba(240,216,145,.13);background:rgba(4,20,11,.24)}
.seq{width:52px;height:72px;display:grid;place-items:center;background:linear-gradient(145deg,#fffdf7,#ece7db);color:#23190f;border-radius:9px;font-weight:900;font-size:20px;box-shadow:0 6px 12px rgba(0,0,0,.2)}
.seq-arrow{color:var(--gold);font-size:15px}
.empty{font-size:13px;color:#91a59a}
.action-row{display:flex;flex-direction:column;align-items:center;gap:10px}
.status{min-height:22px;text-align:center;font-size:14px;font-weight:750;color:var(--cream)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.primary,.secondary{min-height:46px;padding:11px 20px;border-radius:13px;border:1px solid transparent;font-weight:850;cursor:pointer;transition:transform .15s ease,filter .15s ease,opacity .15s ease}
.primary{background:linear-gradient(180deg,#e1c36c,#bd9840);color:#1c1409;box-shadow:0 8px 18px rgba(0,0,0,.2)}
.secondary{background:rgba(10,29,17,.56);border-color:var(--line);color:var(--cream)}
.primary:hover:not(:disabled),.secondary:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.05)}
button:disabled{opacity:.38;cursor:default;transform:none!important}
.hand-zone{margin-top:2px;padding-top:15px;border-top:1px solid rgba(240,216,145,.1)}
.hand-label{text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);margin-bottom:9px}
.my-hand .card{width:clamp(54px,7.4vw,72px)}
.lobby-shell{display:grid;place-items:center;min-height:min(760px,calc(100dvh - 32px));padding:28px}
.lobby-card{width:min(520px,100%);padding:clamp(24px,5vw,42px);border-radius:22px;background:linear-gradient(180deg,rgba(17,52,29,.96),rgba(7,29,17,.96));border:1px solid rgba(240,216,145,.15);box-shadow:var(--shadow);text-align:center}
.lobby-kicker{text-transform:uppercase;letter-spacing:.18em;color:var(--gold-soft);font-size:11px;font-weight:800}
.lobby-card h1{font-size:clamp(32px,7vw,54px);margin:8px 0 6px}.lobby-sub{color:var(--muted);margin:0 0 24px}
.lobby-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.join-row{display:flex;gap:8px;margin-top:10px}.join-row input{flex:1}
input{min-width:0;height:46px;padding:0 14px;border-radius:13px;border:1px solid var(--line);background:rgba(3,16,9,.5);color:var(--cream);text-transform:uppercase;letter-spacing:.14em;text-align:center}.message{min-height:22px;color:#f2d58c;font-size:13px}
.dev-tools{margin-top:18px}.dev-tools summary{cursor:pointer;color:#83988a;font-size:11px}.dev-log{margin-top:8px;max-height:160px;overflow:auto;padding:10px;border-radius:12px;background:rgba(0,0,0,.18);font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#9eb0a3}
.status-pill{padding:6px 9px;border-radius:999px;font-size:11px;border:1px solid var(--line);color:var(--muted)}
@media(max-width:700px){
  body{padding:6px}.wood-frame{padding:5px;border-radius:18px}.table{border-radius:14px;padding:10px;min-height:calc(100dvh - 12px)}
  .topbar{min-height:44px}.brand{font-size:15px}.meta .hide-mobile{display:none}
  .scoreboard{padding:9px 15px;gap:11px}.board{gap:12px;grid-template-rows:auto minmax(130px,1fr) auto}
  .player-card{width:94%;padding:8px 10px}.table-center{gap:12px}.sequence{min-height:76px;padding:9px 10px;gap:7px}.seq{width:43px;height:59px;font-size:17px}
  .cards{gap:5px}.card{border-radius:8px}.my-hand{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:2px 2px 9px}.my-hand .card{flex:0 0 auto}
  .actions{width:100%}.primary,.secondary{flex:1;min-width:130px}.hand-zone{padding-top:11px}
  .lobby-shell{min-height:calc(100dvh - 12px);padding:16px}.lobby-actions{grid-template-columns:1fr}.join-row{flex-direction:column}
}
<style>.connection-banner{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:20;padding:10px 16px;border-radius:999px;background:#3a2411;color:#f5ddb0;border:1px solid #a97a3b;box-shadow:0 10px 28px rgba(0,0,0,.25);font-weight:700}.state-banner{margin-top:10px;padding:10px 12px;border-radius:10px;background:#193b23;border:1px solid #37663f;color:#d9e6dc}.waiting{color:#d9c77c}@media(max-width:650px){.connection-banner{width:calc(100% - 20px);text-align:center;font-size:13px}}</style>
</head>
<body>
<main>
<section id="lobby" class="wood-frame"><div id="lobbyState" class="state-banner waiting">Conectare la server…</div>
  <div class="lobby-shell table">
    <div class="lobby-card">
      <div class="lobby-kicker">Șeptică Multiplayer</div>
      <h1>Șeptică</h1>
      <p class="lobby-sub">Joc de cărți 1v1. Creează o masă sau intră într-una existentă.</p>
      <div class="lobby-actions">
        <button class="primary" id="create">Creează cameră</button>
        <button class="secondary" id="join">Intră în cameră</button>
      </div>
      <div class="join-row"><input id="roomCode" maxlength="5" placeholder="COD MASĂ" aria-label="Cod masă"><button class="secondary" id="joinSecondary">Intră</button></div>
      <p id="message" class="message"></p>
    </div>
  </div>
</section>

<section id="game" class="wood-frame hidden">
  <div class="table">
    <div class="topbar">
      <div class="brand">Șeptică</div>
      <div class="meta">
        <span class="chip">Masă <b id="code"></b></span>
        <span class="chip">Runda <b id="round"></b></span>
        <span class="chip hide-mobile">Pachet <b id="deck"></b></span>
      </div>
    </div>

    <div class="score">
      <div class="scoreboard">
        <div class="score-side"><div class="score-name">A</div><div class="score-number" id="smallA">0</div></div>
        <div class="score-divider">RONDA</div>
        <div class="score-side"><div class="score-name">B</div><div class="score-number" id="smallB">0</div></div>
      </div>
    </div>

    <div class="board">
      <div class="player-row">
        <div class="player-card"><div class="avatar" id="oppAvatar">B</div><div class="player-info"><div class="player-label">Adversar</div><div class="player-value"><span id="oppCount">0</span> cărți</div></div><span id="oppTurn" class="turn-dot"></span></div>
      </div>

      <div class="table-center">
        <div class="opponent-hand"><div id="opp" class="cards"></div></div>
        <div class="sequence-wrap"><div id="sequence" class="sequence"><span class="empty">Nicio secvență activă</span></div></div>
        <div class="action-row"><div id="status" class="status">Așteaptă adversarul.</div><div class="actions"><button id="take" class="primary" disabled>Ia-le</button><button id="next" class="secondary hidden">Rundă nouă</button></div></div>
      </div>

      <div class="hand-zone">
        <div class="hand-label">Mâna ta · <span id="me">A</span></div>
        <div id="hand" class="cards my-hand"></div>
      </div>
    </div>

    <details class="dev-tools">
      <summary>Jurnal de debug</summary>
      <div id="log" class="dev-log"></div>
    </details>
  </div>
</section>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io(),$=id=>document.getElementById(id);let me=0;\nfunction setConnection(text,show){$("connection").textContent=text;$("connection").classList.toggle("hidden",!show)}\nfunction lobbyReady(){$("lobbyState").textContent="Alege: creează o cameră sau introdu codul adversarului."}
function show(){$("lobby").classList.add("hidden");$("game").classList.remove("hidden")}
function joinRoom(){$("roomCode").value=$("roomCode").value.toUpperCase().trim();socket.emit("join_room",$("roomCode").value)}
$("create").onclick=()=>socket.emit("create_room");
$("join").onclick=joinRoom;
$("joinSecondary").onclick=joinRoom;
$("roomCode").addEventListener("keydown",e=>{if(e.key==="Enter")joinRoom()});
socket.on("connect",()=>{setConnection("",false);lobbyReady()});\nsocket.on("disconnect",()=>{setConnection("Conexiunea a fost pierdută. Reîncercăm…",true);if(document.body.contains($("status"))) $("status").textContent="Reconectare la server…"});\nsocket.on("connect_error",()=>setConnection("Nu ne putem conecta la server.",true));\nsocket.on("room_created",d=>{me=d.player;show();$("code").textContent=d.code;$("me").textContent="A";$("lobbyState").textContent="Așteaptă adversarul…"});
socket.on("room_joined",d=>{me=d.player;show();$("code").textContent=d.code;$("me").textContent="B";$("lobbyState").textContent="Ai intrat la masă."});
socket.on("error_message",m=>$("message").textContent=m);
socket.on("opponent_disconnected",()=>{$("status").textContent="Adversarul s-a deconectat. Așteaptă reconectarea.";});
socket.on("state",s=>{
  show();
  $("code").textContent=s.room;$("me").textContent=s.player?"B":"A";$("round").textContent=s.round;
  $("deck").textContent=s.deck;$("smallA").textContent=s.small[0];$("smallB").textContent=s.small[1];
  $("oppCount").textContent=s.opponentCount;
  $("opp").innerHTML=Array.from({length:s.opponentCount},()=>'<div class="card back">?</div>').join("");
  $("hand").innerHTML=s.hand.map(c=>`<div class="card ${s.status==="playing"&&s.turn===s.player?"":"disabled"}" data-c="${c}">${c}</div>`).join("");
  [...$("hand").children].forEach(x=>x.onclick=()=>!x.classList.contains("disabled")&&socket.emit("play_card",x.dataset.c));
  $("sequence").innerHTML=s.sequence.length?s.sequence.map((c,i)=>`<div class="seq">${c}</div>${i<s.sequence.length-1?'<span class="seq-arrow">→</span>':''}`).join(""):'<span class="empty">Nicio secvență activă</span>';
  const ownTurn=s.status==="playing"&&s.turn===s.player;
  $("status").textContent=s.status==="waiting"?"Așteaptă adversarul.":s.status==="playing"?(ownTurn?"Este rândul tău.":"Așteaptă adversarul."):(s.roundResult?.draw?"Egalitate — joc dublu.":s.status==="game_finished"?"Partida s-a terminat.":"Runda s-a terminat.");
  $("oppTurn").classList.toggle("active",s.status==="playing"&&s.turn===1-s.player);
  $("take").disabled=!(ownTurn&&s.sequence.length>=2);
  $("next").classList.toggle("hidden",!(s.status==="round_finished"||s.status==="round_draw"||s.status==="game_finished"));
  $("next").disabled=s.player!==0;
  $("log").textContent=s.log.join("\n");
});
$("take").onclick=()=>socket.emit("take");$("next").onclick=()=>socket.emit("next_round");
</script>
</body>
</html>
